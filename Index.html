<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>GaneshGPT</title>

<!-- Include marked.js for Markdown parsing -->
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f7f7f8;
    padding-bottom: 100px;
}

/* Chat area */
.chat-container {
    max-width: 800px;
    margin: auto;
    padding: 20px;
}

/* Message */
.message {
    background: white;
    border-radius: 12px;
    padding: 16px;
    margin-bottom: 15px;
    border: 1px solid #e5e7eb;
    line-height: 1.5;
}

/* Plain message without box for actual prompts and responses */
.plain-message {
    padding: 8px 0;
    margin-bottom: 15px;
    line-height: 1.5;
}
.plain-message p {
    margin: 0 0 10px 0;
}
.plain-message p:last-child {
    margin: 0;
}

/* Code block */
.code-block {
    background: #f9fafb;
    border: 1px solid #e5e7eb;
    border-radius: 10px;
    overflow: hidden;
    margin-top: 10px;
    margin-bottom: 10px;
}

.code-header {
    padding: 8px 12px;
    font-size: 13px;
    display: flex;
    justify-content: space-between;
    background: #f3f4f6;
    border-bottom: 1px solid #e5e7eb;
    font-family: Arial, sans-serif;
}

.code-header button {
    border: none;
    background: #111827;
    color: white;
    padding: 4px 8px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 12px;
}

.code-block pre {
    margin: 0;
    padding: 12px;
    overflow-x: auto;
    font-family: Consolas, monospace;
}

/* Input bar */
.input-bar {
    position: fixed;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%);
    width: 800px;
    display: flex;
    background: white;
    border: 1px solid #ddd;
    border-radius: 30px;
    padding: 10px;
    box-sizing: border-box;
}

.input-bar input {
    flex: 1;
    border: none;
    outline: none;
    font-size: 16px;
    padding-left: 10px;
}

/* Send button */
.send-btn {
    width: 40px;
    height: 40px;
    border-radius: 50%;
    border: none;
    background: black;
    color: white;
    cursor: pointer;
    font-size: 18px;
    display: flex;
    align-items: center;
    justify-content: center;
}

@media (max-width: 850px) {
    .input-bar { width: 90%; }
}
</style>
</head>

<body>

<div class="chat-container" id="chat">
</div>

<div class="input-bar">
    <input id="prompt" placeholder="Ask anything">
    <button class="send-btn" onclick="sendPrompt()">↑</button>
</div>

<script>
// Configure Markdown to use the custom code blocks
const renderer = new marked.Renderer();
renderer.code = function(code, infostring, escaped) {
    const text = typeof code === 'object' ? code.text : code;
    const lang = typeof code === 'object' ? (code.lang || '') : (infostring || '');
    const language = lang || 'text';
    
    const escapedContent = text.replace(/</g, '&lt;').replace(/>/g, '&gt;');
    return '<div class="code-block">' +
           '<div class="code-header">' +
           '<span>' + language + '</span>' +
           '<button onclick="copyCode(this)">Copy</button>' +
           '</div>' +
           '<pre><code>' + escapedContent + '</code></pre>' +
           '</div>';
};
marked.use({ renderer });

function copyCode(btn) {
    const code = btn.parentElement.nextElementSibling.innerText;
    navigator.clipboard.writeText(code);
    btn.innerText = "Copied";
    setTimeout(() => btn.innerText = "Copy", 1500);
}

async function sendPrompt() {
    const input = document.getElementById("prompt");
    const chat = document.getElementById("chat");

    const text = input.value.trim();
    if (!text) return;

    // Show user message
    const userMsg = document.createElement("div");
    userMsg.className = "plain-message";
    userMsg.innerHTML = "<img src='user.png' alt='User' width='20' height='20' shape='circle'> " + text;
    chat.appendChild(userMsg);

    // Show bot thinking state
    const botMsg = document.createElement("div");
    botMsg.className = "plain-message";
    botMsg.innerHTML = "<img src='Chatimg.png' alt='Bot' width='20' height='20' shape='circle'> Thinking...";
    chat.appendChild(botMsg);

    input.value = "";
    window.scrollTo(0, document.body.scrollHeight);

    try {
        const res = await fetch("http://127.0.0.1:5000/ask", {
            method: "POST",
            headers: {"Content-Type": "application/json"},
            body: JSON.stringify({ prompt: text })
        });

        const data = await res.json();
        
        let i = 0;
        const response = data.response;
        let currentText = "";
        botMsg.className = "plain-message";
        botMsg.innerHTML = "";

        // Standard, simple typing effect
        function type() {
            if (i < response.length) {
                currentText += response[i];
                botMsg.innerHTML = marked.parse(currentText);
                i++;
                window.scrollTo(0, document.body.scrollHeight);
                setTimeout(type, 10);
            }
        }
        type();

    } catch (err) {
        botMsg.innerText = "Error connecting to backend.";
    }
}
</script>

</body>
</html>
